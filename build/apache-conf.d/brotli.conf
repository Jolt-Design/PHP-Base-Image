<IfModule mod_brotli.c>
	AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript
	AddOutputFilterByType BROTLI_COMPRESS application/x-javascript application/javascript application/ecmascript
	AddOutputFilterByType BROTLI_COMPRESS application/rss+xml application/wasm application/xml
	BrotliCompressionQuality 4

	# deflate.conf's DEFLATE filter runs first, so stop it for clients that accept Brotli.
	SetEnvIfNoCase Accept-Encoding \bbr\b no-gzip
</IfModule>
