name: Build and Push

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: Suffix appended to every tag (for test runs)
        default: ""
      php_versions:
        description: Comma-separated PHP versions to build instead of versions.json
        default: ""
  schedule:
    # Run every Sunday at 4:20
    - cron: "20 4 * * 0"
  push:
    branches: [master]
    paths:
      - .github/workflows/bake.yml
      - build/**
      - docker-bake.hcl
      - versions.json

env:
  REGISTRY_IMAGE: joltdesign/php
  # Bake variable: appended to every tag. Empty except on manual test runs.
  tag_suffix: ${{ inputs.tag_suffix }}
  INPUT_PHP_VERSIONS: ${{ inputs.php_versions }}

jobs:
  # Build every bake target for one platform on a native runner and push the
  # images untagged (by digest). The merge job tags them.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read PHP versions
        id: versions
        run: echo "versions=${INPUT_PHP_VERSIONS:-$(jq -r '.["php-versions"] | join(",")' versions.json)}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@v7
        env:
          PLATFORMS: ${{ matrix.platform }}
          PHP_VERSIONS: ${{ steps.versions.outputs.versions }}
        with:
          set: |
            *.tags=
            *.output=type=image,"name=${{ env.REGISTRY_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export metadata
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          mkdir -p "${{ runner.temp }}/metadata"
          echo "$METADATA" > "${{ runner.temp }}/metadata/metadata-${PLATFORM_PAIR}.json"

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: metadata-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/metadata/*
          if-no-files-found: error
          retention-days: 1

  # For each bake target, combine the per-platform digests into one manifest
  # list and give it the target's tags from docker-bake.hcl.
  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download metadata
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/metadata
          pattern: metadata-*
          merge-multiple: true

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest lists and push
        env:
          METADATA_DIR: ${{ runner.temp }}/metadata
        run: |
          set -euo pipefail
          # ALL_PHP_VERSIONS keeps the latest tags on the highest version in
          # versions.json when php_versions builds a subset
          ALL_PHP_VERSIONS="$(jq -r '.["php-versions"] | join(",")' versions.json)"
          export ALL_PHP_VERSIONS
          PHP_VERSIONS="${INPUT_PHP_VERSIONS:-$ALL_PHP_VERSIONS}" \
            docker buildx bake --print > "$RUNNER_TEMP/bake.json"

          metadata_files=("$METADATA_DIR"/metadata-*.json)
          platform_count=${#metadata_files[@]}

          for target in $(jq -r '.target | keys[]' "$RUNNER_TEMP/bake.json"); do
            mapfile -t tags < <(jq -r --arg t "$target" '.target[$t].tags[]' "$RUNNER_TEMP/bake.json")
            mapfile -t digests < <(jq -r --arg t "$target" '.[$t]["containerimage.digest"] // empty' "$METADATA_DIR"/metadata-*.json)

            if [ "${#digests[@]}" -ne "$platform_count" ]; then
              echo "::error::$target has ${#digests[@]} digests, expected $platform_count"
              exit 1
            fi

            args=()
            for tag in "${tags[@]}"; do args+=(-t "$tag"); done
            for digest in "${digests[@]}"; do args+=("$REGISTRY_IMAGE@$digest"); done

            echo "::group::$target -> ${tags[*]}"
            docker buildx imagetools create "${args[@]}"
            echo "::endgroup::"
          done

      - name: Inspect image
        # A subset run may not include the latest tag, so inspect the first tag built
        run: docker buildx imagetools inspect "$(jq -r '[.target[].tags[]][0]' "$RUNNER_TEMP/bake.json")"
